# ===== 漫剧制片厂 ComicDrama Agent 配置 =====
# 说明：三项模型全部留空时，系统进入「离线兜底模式」：
#   LLM   -> 使用内置编剧模板
#   图像  -> 使用 ffmpeg 渲染的漫画面板占位关键帧
#   TTS   -> 使用合成的环境音床
# 填好任意一项即可自动切换到真实模型，其余项继续走兜底。

# 服务端口与产物目录
Comic-Port: 8787
Comic-Output-Root: /data/comicdrama

# 竖屏成片参数（默认 5 镜头 x 3 秒 = 15 秒）
Comic-Video-Width: 1080
Comic-Video-Height: 1920
Comic-Video-FPS: 25
Comic-Shot-Seconds: 3
Comic-Shot-Count: 5

# Gemini 兼容接口（文本 + 图像），本地反代 / 官方网关均可
Gemini-API-KEY:
Gemini-BASE-URL: http://127.0.0.1:5345
Gemini-Text-MODEL: gemini-2.5-flash
Gemini-MODEL: gemini-2.5-flash-image

# TTS（默认走模力方舟/Gitee 的 IndexTTS-2，支持情绪提示）
TTS-Endpoint: https://ai.gitee.com/v1/audio/speech
TTS-Model: IndexTTS-2
TTS-API-KEY:
TTS-Prompt-Audio-URL:
TTS-Prompt-Text:

# 图生视频（可灵 Kling）：二选一填鉴权
#   A. 只有 API Key：填 Provider-kling-API-KEY
#   B. 开放平台的 AccessKey + SecretKey：填下面两项（适配器自动改用 JWT 签名）
Provider-I2V: kling
Provider-kling-API-KEY:
Provider-kling-ACCESS-KEY:
Provider-kling-SECRET-KEY:
Provider-kling-BASE-URL: https://api-beijing.klingai.com
Provider-kling-MODEL: kling-v1-6
Provider-kling-MODE: std
Provider-kling-MAX-SECONDS: 5
